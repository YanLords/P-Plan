[package]
name = "planfeu"
version = "0.2.0"
description = "Planete Plan - plans de disposition de feux d'artifice"
authors = ["Artifeu"]
edition = "2021"

[lib]
name = "planfeu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
